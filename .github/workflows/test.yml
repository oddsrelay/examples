name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Every folder carries the same api.py
        run: for f in */api.py; do cmp "$f" oddsmatcher-50/api.py; done
      - name: flumine, for flumine-bookmaker-prices (it needs Python 3.10 or later)
        if: matrix.python != '3.9'
        run: pip install -r flumine-bookmaker-prices/requirements.txt
      - name: Tests (no network, no key)
        run: for m in */main.py; do (cd "$(dirname "$m")" && python -m unittest -v) || exit 1; done
      - name: n8n workflows, their Code nodes on the fixtures (no network, no key)
        if: matrix.python == '3.13'
        run: for t in */test.mjs; do node --test "$t" || exit 1; done
